name: Daily Schedule Scraper

on:
  schedule:
    # Runs automatically every day at 00:00 UTC
    - cron: '0 12 * * *'
  # Allows manual execution from the GitHub Actions UI
  workflow_dispatch:

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 lxml pandas
          playwright install chromium

      - name: Run Scraper
        run: python scraper.py

      - name: Verify Data Scraped
        run: |
          # Checks if the file contains the word "course"
          if ! grep -q "course" classes.xml; then
            echo "Error: No courses found in XML. The website structure may have changed."
            exit 1 # This forces the workflow to fail and triggers the email
          fi

      - name: Commit and Push updated XML
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated update of classes.xml"
          file_pattern: "classes.xml"
